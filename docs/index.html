<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totais por semana — eVisita Ponta Porã</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo"><img src="logo.png" alt="Prefeitura Municipal de Ponta Porã">
  <div><h1>Totais por semana — eVisita</h1><div class="su" id="sub">Carregando…</div></div></header>
<div class="faixa"></div>
<main>
  <div class="bar">
    <button id="aba-estadual" aria-selected="true">Planilha Estadual</button>
    <button id="aba-coordenada" aria-selected="false">Resposta Coordenada</button>
    <span class="sp"></span>
    <a href="dashboard.html"><button>Dashboard</button></a>
    <button data-marcar="todas">Marcar todas</button><button data-marcar="limpar">Limpar</button>
    <button id="copiar">Copiar tabela</button>
  </div>
  <div id="conteudo"></div>
  <div class="nota" id="nota"></div>
</main>
<footer class="rodape">Prefeitura Municipal de Ponta Porã · Dados extraídos do eVisita · atualização automática às segundas e terças</footer>
<script src="comum.js"></script>
<script>
const PERC = new Set(["IIP", "IB", "Índice de pendência (%)", "Cobertura (%)"]);
let dados = null, aba = "estadual";
const dm = iso => iso.split("-").reverse().slice(0, 2).join("/");
const fmt = (v, c) => Number(v).toLocaleString("pt-BR", PERC.has(c)
  ? {minimumFractionDigits: 2, maximumFractionDigits: 2} : {maximumFractionDigits: 2});

function montar() {
  const cols = aba === "estadual" ? dados.colunas_estadual : dados.colunas_coordenada;
  const sem = [...dados.semanas].sort((a, b) => b.id_semana - a.id_semana);
  const cab = ["Semana", ...cols].map(c => `<th>${c}</th>`).join("");
  const lin = sem.map((s, i) => {
    const v = aba === "estadual" ? s.estadual : s.coordenada;
    return `<tr class="${i === 0 ? "atual" : ""}"><td class="s" data-o="${s.id_semana}"><input type="checkbox" class="ck" aria-label="Selecionar linha"><span class="l">Semana ${s.semana} · id ${s.id_semana} (${dm(s.inicio)} a ${dm(s.fim)})</span>` +
      (s.avisos ? `<span class="av" title="${s.avisos.join(" | ").replace(/"/g, "'")}">⚠</span>` : "") +
      `<button class="cp" title="Copiar só os valores desta linha">Copiar</button></td>` +
      v.map((x, j) => `<td class="v" data-label="${cols[j]}">${fmt(x, cols[j])}</td>`).join("") + "</tr>";
  }).join("");
  document.getElementById("conteudo").innerHTML = `<table class="rt" id="tabela"><thead><tr>${cab}</tr></thead><tbody>${lin}</tbody></table>`;
  montarOrdenacao(document.getElementById("tabela"));
}

function trocar(n) {
  aba = n;
  document.getElementById("aba-estadual").setAttribute("aria-selected", n === "estadual");
  document.getElementById("aba-coordenada").setAttribute("aria-selected", n === "coordenada");
  montar();
}
document.getElementById("aba-estadual").onclick = () => dados && trocar("estadual");
document.getElementById("aba-coordenada").onclick = () => dados && trocar("coordenada");
document.getElementById("copiar").onclick = e => {
  const t = document.getElementById("tabela"); if (!t) return;
  copiarTexto([...t.rows].map(r => [...r.cells].map(c => (c.querySelector(".l") || c).textContent).join("\t")).join("\n"), e.target);
};

fetch("dados.json", {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  dados = d;
  document.getElementById("sub").textContent = d.municipio + " · atualizado em " +
    new Date(d.atualizado_em).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"});
  document.getElementById("nota").textContent = "Linha destacada = semana mais recente (pode estar em andamento). " +
    "TOTAL de cada semana = RURAL + P.E. + URBANA. ⚠ = semana com dado não encontrado no eVisita (veja a dica ao passar o mouse). O botão Copiar copia só os valores, na ordem das colunas da planilha oficial; marque várias linhas nas caixas e clique em Copiar para levá-las de uma vez (da semana mais antiga para a mais recente).";
  montar();
}).catch(() => {
  document.getElementById("sub").textContent = "";
  document.getElementById("conteudo").innerHTML = '<div class="erro">Ainda não há dados publicados. Aguarde a primeira coleta automática.</div>';
});
</script>
</body>
</html>
