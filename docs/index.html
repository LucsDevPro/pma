<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totais por semana — eVisita Ponta Porã</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo"><img src="logo.png" alt="Prefeitura Municipal de Ponta Porã">
  <div><h1>Totais por semana — eVisita</h1><div class="su" id="sub">Carregando…</div></div><nav class="nav"><a href="index.html" class="on">Totais</a><a href="dashboard.html">Dashboard</a></nav></header>
<div class="faixa"></div>
<main>
  <div class="kicker" id="kicker"></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <button id="aba-estadual" aria-selected="true">Planilha Estadual</button>
    <button id="aba-coordenada" aria-selected="false">Resposta Coordenada</button>
    <span class="sp"></span>
    
    <button data-marcar="todas">Marcar todas</button><button data-marcar="limpar">Limpar</button>
    <button id="copiar">Copiar tabela</button>
  </div>
  <div id="conteudo"></div>
  <div class="nota" id="nota"></div>
</main>
<footer class="rodape">Prefeitura Municipal de Ponta Porã · Dados extraídos do eVisita · atualização automática às segundas e terças</footer>
<script src="comum.js"></script>
<script>
const SINALIZAR = ["larvicida"];   // produtos sinalizados quando a semana não tem uso (pode incluir "adulticida")
const PERC = new Set(["IIP", "IB", "Índice de pendência (%)", "Cobertura (%)"]);
let dados = null, aba = "estadual";
const dm = iso => iso.split("-").reverse().slice(0, 2).join("/");
const KG = "Focal - Gramas";   // no site esta coluna aparece em kg (gramas ÷ 1000); os dados continuam em gramas
const rotulo = c => (c === KG ? "Focal - Kg" : c);
const SACHE = "Perifocal - Sachê";   // no site aparece em nº de sachês de 100 g (gramas ÷ 100, inteiro): sobra de 50 g ou mais conta +1; abaixo de 50 g conta 0
const fmt = (v, c) => c === KG
  ? (v / 1000).toLocaleString("pt-BR", {minimumFractionDigits: 3, maximumFractionDigits: 3})
  : c === SACHE
  ? Math.round(v / 100 + 1e-6).toLocaleString("pt-BR")
  : Number(v).toLocaleString("pt-BR", PERC.has(c) ? {minimumFractionDigits: 2, maximumFractionDigits: 2} : {maximumFractionDigits: 2});

function montar() {
  const cols = aba === "estadual" ? dados.colunas_estadual : dados.colunas_coordenada;
  const sem = [...dados.semanas].sort((a, b) => b.id_semana - a.id_semana);
  const cab = ["Semana", ...cols].map(c => `<th>${rotulo(c)}</th>`).join("");
  const lin = sem.map((s, i) => {
    const v = aba === "estadual" ? s.estadual : s.coordenada;
    return `<tr class="${i === 0 ? "atual" : ""}"><td class="s" data-o="${s.id_semana}"><input type="checkbox" class="ck" aria-label="Selecionar linha"><span class="l">Semana ${s.semana} · id ${s.id_semana} (${dm(s.inicio)} a ${dm(s.fim)})</span>` +
      (s.sem_uso || []).filter(u => SINALIZAR.includes(u)).map(u => `<span class="nt" title="Nenhum registro de ${u} no eVisita nesta semana">Sem ${u}</span>`).join("") +
      `<div class="acoes"><button class="dtl" aria-expanded="false" title="Ver detalhes por atividade">Detalhes ▾</button>` +
      `<button class="cp" title="Copiar só os valores desta linha">Copiar</button></div></td>` +
      v.map((x, j) => `<td class="v" data-label="${rotulo(cols[j])}">${fmt(x, cols[j])}</td>`).join("") + "</tr>";
  }).join("");
  document.getElementById("conteudo").innerHTML = `<table class="rt" id="tabela"><thead><tr>${cab}</tr></thead><tbody>${lin}</tbody></table>`;
  montarOrdenacao(document.getElementById("tabela"));
}

function resumo() {   // cartões com a semana mais recente
  const s = [...dados.semanas].sort((a, b) => b.id_semana - a.id_semana)[0]; if (!s) return;
  const e = s.estadual, c = s.coordenada, n = v => Number(v).toLocaleString("pt-BR", {maximumFractionDigits: 0});
  const k = (ic, rot, v, cor) => `<div class="k" style="--c:${cor}"><span class="ic">${ICONES[ic]}</span><small>${rot}</small><b>${v}</b></div>`;
  document.getElementById("kicker").textContent = `Semana ${s.semana} · ${dm(s.inicio)} a ${dm(s.fim)} — resumo da mais recente`;
  document.getElementById("kpis").innerHTML =
    k("imov", "Imóveis trabalhados", n(e[0]), "var(--ac)") + k("cob", "Cobertura", fmt(c[5], "Cobertura (%)") + "%", "var(--navy)") +
    k("pend", "Índice de pendência", fmt(c[4], "Índice de pendência (%)") + "%", "var(--verm)") +
    k("foco", "Trabalhados com foco", n(e[1]), "var(--turq)") + k("larv", "Tratados com larvicida", n(e[2]), "var(--bl)");
}

function detalhe(s) {   // linha escondida com RURAL, P.E. e URBANA da semana
  const cols = aba === "estadual" ? dados.colunas_estadual : dados.colunas_coordenada;
  const tr = document.createElement("tr"), td = document.createElement("td");
  tr.className = "det"; td.className = "dd"; td.colSpan = cols.length + 1;
  const info = `Ciclo URB/RURAL ${s.ciclo_urb_rural} · Ciclo P.E ${s.ciclo_pe} · coletado em ` +
    new Date(s.coletado_em).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) +
    ((s.sem_uso || []).length ? ` · sem uso de ${s.sem_uso.join(" e ")}` : "");
  const corpo = !s.atividades ? '<div class="erro">Detalhes por atividade disponíveis a partir da próxima coleta.</div>' :
    `<table class="rt dt"><thead><tr><th>Atividade</th>${cols.map(c => `<th>${rotulo(c)}</th>`).join("")}</tr></thead><tbody>` +
    s.atividades.map(a => `<tr><td class="s">${a.nome}</td>` +
      (aba === "estadual" ? a.estadual : a.coordenada).map((x, j) => `<td class="v" data-label="${rotulo(cols[j])}">${fmt(x, cols[j])}</td>`).join("") + "</tr>").join("") +
    "</tbody></table>";
  td.innerHTML = `<div class="dnota"><b>Semana ${s.semana}</b> · ${info}</div>${corpo}`;
  tr.appendChild(td);
  return tr;
}

document.addEventListener("click", e => {   // Detalhes ▾ / Ocultar ▴
  const b = e.target.closest(".dtl"); if (!b) return;
  const tr = b.closest("tr"), prox = tr.nextElementSibling;
  if (prox && prox.classList.contains("det")) {
    prox.remove(); b.textContent = "Detalhes ▾"; b.setAttribute("aria-expanded", "false"); return;
  }
  const s = dados.semanas.find(x => x.id_semana === +tr.querySelector("td.s").dataset.o);
  tr.after(detalhe(s)); b.textContent = "Ocultar ▴"; b.setAttribute("aria-expanded", "true");
});

function trocar(n) {
  aba = n;
  document.getElementById("aba-estadual").setAttribute("aria-selected", n === "estadual");
  document.getElementById("aba-coordenada").setAttribute("aria-selected", n === "coordenada");
  montar();
}
document.getElementById("aba-estadual").onclick = () => dados && trocar("estadual");
document.getElementById("aba-coordenada").onclick = () => dados && trocar("coordenada");
document.getElementById("copiar").onclick = e => {
  const t = document.getElementById("tabela"); if (!t) return;
  copiarTexto([...t.rows].filter(r => !r.classList.contains("det")).map(r => [...r.cells].map(c => (c.querySelector(".l") || c).textContent).join("\t")).join("\n"), e.target);
};

fetch("dados.json", {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  dados = d; resumo();
  document.getElementById("sub").textContent = d.municipio + " · atualizado em " +
    new Date(d.atualizado_em).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"});
  document.getElementById("nota").textContent = "Linha destacada = semana mais recente (pode estar em andamento). " +
    "TOTAL de cada semana = RURAL + P.E. + URBANA. “Sem larvicida” = nenhum registro de larvicida no eVisita naquela semana (Focal – Gramas = 0). O botão Copiar copia só os valores, na ordem das colunas da planilha oficial; marque várias linhas nas caixas e clique em Copiar para levá-las de uma vez (da semana mais antiga para a mais recente).";
  montar();
}).catch(() => {
  document.getElementById("sub").textContent = "";
  document.getElementById("conteudo").innerHTML = '<div class="erro">Ainda não há dados publicados. Aguarde a primeira coleta automática.</div>';
});
</script>
</body>
</html>
